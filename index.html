<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lastart Tattoo</title>
<meta name="description" content="Sadece bir dövme değil, bir hikâye. Lastart Tattoo Studio.">
<meta name="theme-color" content="#050607">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f5f9fc;
  --ink-soft:rgba(235,244,250,.74);
  --ice:#e8f2f8;
  --night:#050607;
  --line:rgba(255,255,255,.24);
  --serif:"Cormorant Garamond","Palatino Linotype",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--night);
  min-height:100vh;
  min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main{
  min-height:100vh;
  min-height:100dvh;
  max-width:480px;
  margin:0 auto;
  padding:clamp(28px,6vh,56px) 24px clamp(24px,5vh,44px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.logo{
  width:min(78%,320px);
  height:auto;
  display:block;
}
.studio{
  margin-top:clamp(10px,2vh,18px);
  font-size:.72rem;
  letter-spacing:.5em;
  text-indent:.5em;
  color:var(--ink-soft);
}
.divider{
  display:flex;align-items:center;gap:14px;
  width:min(70%,240px);
  margin:clamp(20px,4vh,34px) 0;
  color:var(--ink);
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider span{font-size:.9rem;line-height:1}
.slogan{
  font-family:var(--serif);
  font-weight:500;
  color:var(--ink);
}
.slogan .l1{
  display:block;
  font-size:clamp(.95rem,4vw,1.15rem);
  letter-spacing:.22em;
  text-transform:uppercase;
}
.slogan .l2{
  display:block;
  margin-top:6px;
  font-size:clamp(2.1rem,10vw,2.9rem);
  font-weight:700;
  letter-spacing:.03em;
  line-height:1.05;
  text-transform:uppercase;
}
.actions{
  width:100%;
  margin-top:auto;
  padding-top:clamp(28px,6vh,52px);
  display:grid;
  gap:12px;
}
.btn{
  display:flex;align-items:center;
  gap:14px;
  min-height:68px;
  padding:0 18px;
  text-decoration:none;
  color:var(--ink);
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);
  border-radius:18px;
  box-shadow:0 12px 30px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  backdrop-filter:blur(14px) saturate(1.2);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.btn:active{transform:scale(.975);background:rgba(255,255,255,.22)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn svg.icon{width:36px;height:36px;flex:none}
.btn .sep{width:1px;align-self:stretch;margin:20px 0;background:var(--line)}
.btn .label{
  flex:1;text-align:left;
  font-family:var(--serif);
  font-size:clamp(1.02rem,4.5vw,1.3rem);
  font-weight:600;
  line-height:1.15;
  letter-spacing:0;
  text-wrap:balance;
}
.btn svg.chev{width:20px;height:20px;flex:none;opacity:.8}
@media (hover:hover){
  .btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}
}
.thanks{
  margin-top:clamp(22px,4vh,34px);
  font-family:var(--serif);
  font-size:1rem;
  letter-spacing:.06em;
  color:var(--ink-soft);
}
@media (max-height:640px){
  .logo{width:min(60%,240px)}
  .btn{min-height:64px}
}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--night) url("poster.jpg") center/cover no-repeat}
.bg video{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.50) 0%,rgba(0,0,0,.18) 38%,rgba(0,0,0,.30) 62%,rgba(0,0,0,.68) 100%)}
.slogan{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.logo{filter:drop-shadow(0 2px 14px rgba(0,0,0,.5))}
main{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.bg video{display:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <video autoplay muted loop playsinline preload="auto" poster="poster.jpg" disablepictureinpicture>
    <source src="bg.mp4" type="video/mp4" onerror="this.parentNode.remove()">
  </video>
</div>
<main>
  <img class="logo" src="logo-white.png" alt="Lastart Tattoo" width="575" height="255" fetchpriority="high">
  <p class="studio">TATTOO STUDIO</p>

  <div class="divider" aria-hidden="true"><span>✦</span></div>

  <h1 class="slogan">
    <span class="l1">Sadece bir dövme değil,</span>
    <span class="l2">Bir hikâye.</span>

  <nav class="actions" aria-label="Bağlantılar">
    <a class="btn" href="https://share.google/4RfOuV3kI6BlwsUer" target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/>
        <path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/>
      </svg>
      <span class="sep" aria-hidden="true"></span>
      <span class="label">Google’da Yorum Yap</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a class="btn" href="https://instagram.com/lastarttattoo?dlrf=OG9zeGZnM3luNXdu" target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#feda75"/>

            <stop offset="1" stop-color="#4f5bd5"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="12" fill="url(#ig)"/>
        <rect x="10" y="10" width="28" height="28" rx="8" fill="none" stroke="#fff" stroke-width="3"/>
        <circle cx="24" cy="24" r="6.500" fill="none" stroke="#fff" stroke-width="3"/>
        <circle cx="32" cy="16" r="2" fill="#fff"/>
      </svg>
      <span class="sep" aria-hidden="true"></span>
      <span class="label">Instagram’da Bizi Takip Et</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a class="btn" href="https://maps.app.goo.gl/55KyS8SgNoiaDKu47?g_st=ic" target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#EA4335" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
      </svg>
      <span class="sep" aria-hidden="true"></span>
      <span class="label">Konumumuz / Yol Tarifi</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a class="btn" href="https://wa.me/905452367091?text=Merhaba%2C%20bilgi%20almak%20istiyorum." target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span class="sep" aria-hidden="true"></span>
      <span class="label">WhatsApp ile İletişim</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </nav>

  <p class="thanks">Desteğin bizim için değerli.</p>
</main>
</body>
</html>
